
name: MVSD Guard

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gereksinimleri yükle
        run: pip install -r requirements.txt

      - name: Botu kontrol et
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python -c "import os; assert os.getenv('DISCORD_TOKEN'), 'DISCORD_TOKEN ayarlanmamis'; import discord; print('Kurulum kontrolü başarılı')"
